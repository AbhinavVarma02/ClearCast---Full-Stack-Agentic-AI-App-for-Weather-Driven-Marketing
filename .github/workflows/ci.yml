name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every job runs without OpenAI or OpenWeatherMap credentials: providers are
# replaced by synthetic weather fixtures and a scripted Chat Completions server.
env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "22"

jobs:
  python:
    name: Python lint, tests, evaluation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install locked dependencies
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pip check
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Contract drift check (Pydantic -> JSON Schema)
        run: python -m api.export_contracts --check
      - name: Secret scan
        run: python scripts/check_secrets.py
      - name: Unit and component tests (mocked MCP and LangGraph)
        run: python -m pytest
      - name: Offline evaluation suite
        run: python -m evaluation.run_eval --output-dir eval-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-results
          path: eval-results/

  gateway:
    name: Node.js gateway typecheck, lint, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: gateway/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  integration:
    name: Gateway-to-Python and full-stack integration
    needs: [python, gateway]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: gateway/package-lock.json
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Build gateway
        run: npm ci && npm run build
        working-directory: gateway
      - name: Integration tests (Fastify -> FastAPI -> LangGraph -> MCP, offline)
        env:
          CLEARCAST_REQUIRE_INTEGRATION: "1"
        run: python -m pytest -m integration -v

  docker:
    name: Docker build and container smoke test
    needs: [python, gateway]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements.txt
      - name: Build image
        run: docker build -t clearcast:ci .
      - name: Start scripted model server and container (offline fixtures)
        run: |
          python -m evaluation.fake_openai_server --port 8099 &
          docker run -d --name clearcast --network host \
            -e CLEARCAST_WEATHER_FIXTURES=baseline_mild \
            -e OPENAI_API_KEY=sk-offline-fixture-not-a-real-key \
            -e OPENAI_BASE_URL=http://127.0.0.1:8099/v1 \
            clearcast:ci
          for i in $(seq 1 90); do
            curl -fsS http://127.0.0.1:7860/ >/dev/null && break
            sleep 2
          done
      - name: Smoke test through the public Gradio API
        run: python scripts/smoke_test.py --url http://127.0.0.1:7860 --expect-fixture
      - name: Container logs contain no credentials
        if: always()
        run: |
          docker logs clearcast > container.log 2>&1 || true
          tail -n 40 container.log
          ! grep -q "sk-offline-fixture-not-a-real-key" container.log
