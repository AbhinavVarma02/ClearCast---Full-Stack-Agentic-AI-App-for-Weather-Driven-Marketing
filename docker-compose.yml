# Local container run of the same image deployed to Hugging Face Spaces.
# Only the Gradio port is published; the gateway and orchestrator stay on
# the container's loopback interface.
#
#   OPENAI_API_KEY=... OPENWEATHERMAP_API_KEY=... docker compose up --build
services:
  clearcast:
    build: .
    ports:
      - "7860:7860"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY}
      OPENWEATHERMAP_API_KEY: ${OPENWEATHERMAP_API_KEY:?Set OPENWEATHERMAP_API_KEY}
      LANGCHAIN_TRACING_V2: ${LANGCHAIN_TRACING_V2:-false}
      LANGCHAIN_API_KEY: ${LANGCHAIN_API_KEY:-}
      LANGCHAIN_PROJECT: ${LANGCHAIN_PROJECT:-clearcast}
